[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmkit-research"
version = "0.2.0"
description = "Composable algorithms for agentic swarms and collective knowledge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "MIT"

[project.scripts]
swarmkit = "swarmkit.__main__:main"

[project.optional-dependencies]
economics-solvers = ["open_spiel>=1.6", "negmas>=0.11"]
hypergraphs = ["hypernetx>=2.4", "xgi>=0.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.setuptools.package-data]
swarmkit = ["py.typed"]
